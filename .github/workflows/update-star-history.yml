name: Update star history

on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate static star history
        run: python3 scripts/generate_star_history.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- assets/star-history.json assets/star-history.svg; then
            echo "Star history is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.json assets/star-history.svg
          git commit -m "chore: update star history"
          git push
